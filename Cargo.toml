[package]
name = "ipwho-sdk"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Official Rust SDK for the IPWho IP geolocation API (lookup, me, bulk)."
homepage = "https://www.ipwho.org"
repository = "https://github.com/lavrox/SDK-IPWho-IP-Geolocation-Rust"
documentation = "https://docs.rs/ipwho-sdk"
readme = "README.md"
keywords = ["ipwho", "geoip", "geolocation", "ip", "api"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**/*", "LICENSE", "README.md", "CHANGELOG.md"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
url = "2.5"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
